<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mahakal Ravan Traders</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h1 { 
            text-align: center;
        }

        /* Header */
        .header {
        position: relative;
        display: flex;
        align-items: center;
        height: 60px;
        }
        
        .header h1 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
        }
        
        .cart-btn {
            margin-left: auto;
        }

        .cart-btn {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-box {
            max-width: 400px;
            margin: 20px auto;
            display: block;
            padding: 10px 15px;
            font-size: 16px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* Products */
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            background-color: #f8f8f8;
            border-radius: 5px;
        }

        .product-name {
            font-weight: bold;
            margin-top: 10px;
        }

        .product-desc {
            font-size: 14px;
            color: #555;
        }

        .price {
            margin-top: 5px;
        }

        .mrp {
            text-decoration: line-through;
            color: #999;
            margin-right: 8px;
        }

        .selling-price {
            color: #2e7d32;
            font-weight: bold;
        }

        .add-cart-btn {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Cart Panel */
        .cart-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background-color: white;
            box-shadow: -2px 0 8px rgba(0,0,0,0.2);
            padding: 15px;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .cart-panel.open {
            right: 0;
        }

        .cart-item {
            margin-bottom: 10px;
        }

        .qty-btn {
            padding: 3px 8px;
            margin: 0 5px;
            cursor: pointer;
        }

        .order-btn {
            width: 100%;
            padding: 10px;
            background-color: #25D366;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #e0e0e0;
}

.cart-item-left {
    max-width: 65%;
}

.cart-item-name {
    font-weight: bold;
    font-size: 14px;
}

.cart-item-price {
    font-size: 13px;
    color: #666;
}

.cart-item-right {
    display: flex;
    align-items: center;
}

.qty-btn {
    width: 28px;
    height: 28px;
    border: none;
    background-color: #eeeeee;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
}

.qty-btn:hover {
    background-color: #dddddd;
}

.qty-value {
    width: 24px;
    text-align: center;
    font-weight: bold;
}
        .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
    display: none;
    z-index: 9;
}

.cart-panel {
    z-index: 10;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close-cart {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
}
        .out-of-stock {
    margin-top: 10px;
    padding: 8px;
    text-align: center;
    background-color: #eeeeee;
    color: #888;
    font-weight: bold;
    border-radius: 5px;
}

.in-stock {
    margin-top: 10px;
    padding: 6px;
    text-align: center;
    color: #2e7d32;
    font-weight: bold;
}
    </style>
</head>

<body>

<div class="header">
    <h1>Mahakal Ravan Traders</h1>
    <button class="cart-btn" onclick="toggleCart()">Cart (<span id="cartCount">0</span>)</button>
</div>

<input type="text" class="search-box" placeholder="Search products..." id="searchInput">

<div class="product-container" id="productContainer"></div>

<div class="overlay" id="overlay" onclick="toggleCart()"></div>
    
    <!-- Cart Panel -->
<div class="cart-panel" id="cartPanel">
        <div class="cart-header">
        <h3>Your Cart</h3>
        <button class="close-cart" onclick="toggleCart()">✕</button>
    </div>
    <div id="cartItems"></div>
    <h4>Total: ₹<span id="totalAmount">0</span></h4>
    <label style="font-size:14px;"><strong>Name (optional)</strong></label>
    <input
        type="text"
        id="customerName"
        placeholder="Enter your name"
        style="width:100%; padding:8px; margin:5px 0 10px;"
    >
    
    <div style="font-size:14px; margin-bottom:10px;">
        <strong>Payment Method:</strong> Cash on Delivery (COD)
        <br>
        <strong>Phone No.:</strong> +91 8982828031
    </div>
    
    <button class="order-btn" onclick="placeOrder()">Order via WhatsApp</button>
</div>

<script>
    let allProducts = [];
    let cart = {};

    function toggleCart() {
    const cart = document.getElementById('cartPanel');
    const overlay = document.getElementById('overlay');

    const isOpen = cart.classList.contains('open');

    cart.classList.toggle('open');
    overlay.style.display = isOpen ? 'none' : 'block';
}

    function renderProducts(products) {
        const container = document.getElementById('productContainer');
        container.innerHTML = '';

        products.forEach(p => {
            container.innerHTML += `
                <div class="product-card">
                    <img src="${p.image}">
                    <div class="product-name">${p.name}</div>
                    <div class="product-desc">${p.description}</div>
                    <div class="price">
                        <span class="mrp">₹${p.mrp}</span>
                        <span class="selling-price">₹${p.price}</span>
                    </div>
                    ${p.available === 1 
    ? `<button class="add-cart-btn" onclick='addToCart(${JSON.stringify(p)})'>
           Add to Cart
       </button>`
    : `<div class="out-of-stock">Out of Stock</div>`
                    }
                </div>
            `;
        });
    }

    function addToCart(product) {
        if (cart[product.name]) {
            cart[product.name].qty++;
        } else {
            cart[product.name] = { ...product, qty: 1 };
        }
        updateCartUI();
    }

    function updateCartUI() {
        const cartItemsDiv = document.getElementById('cartItems');
        cartItemsDiv.innerHTML = '';
        let total = 0;
        let count = 0;

        for (let key in cart) {
            const item = cart[key];
            total += item.price * item.qty;
            count += item.qty;

           cartItemsDiv.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-left">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">₹${item.price} × ${item.qty}</div>
                    </div>
            
                    <div class="cart-item-right">
                        <button class="qty-btn" onclick="changeQty('${key}', -1)">−</button>
                        <span class="qty-value">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty('${key}', 1)">+</button>
                    </div>
                </div>
            `;
        }

        document.getElementById('totalAmount').innerText = total;
        document.getElementById('cartCount').innerText = count;
    }

    function changeQty(name, delta) {
        cart[name].qty += delta;
        if (cart[name].qty <= 0) delete cart[name];
        updateCartUI();
    }

    function placeOrder() {
        if (Object.keys(cart).length === 0) {
            alert("Cart is empty");
            return;
        }

        const name = document.getElementById('customerName').value.trim();
        let message = "Order Details:%0A";
        
        if (name) {
            message += `Name: ${name}%0A%0A`;
        }
        let total = 0;

        for (let key in cart) {
            const item = cart[key];
            message += `${item.name} - ${item.qty} x ₹${item.price}%0A`;
            total += item.qty * item.price;
        }

        message += `%0ATotal Amount: ₹${total}`;

        const phone = "918982828031";
        window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
    }

    fetch('products.json')
        .then(res => res.json())
        .then(data => {
            allProducts = data;
            renderProducts(allProducts);
        });

    document.getElementById('searchInput').addEventListener('input', function () {
        const q = this.value.toLowerCase();
        renderProducts(
            allProducts.filter(p =>
                p.name.toLowerCase().includes(q) ||
                p.description.toLowerCase().includes(q)
            )
        );
    });
</script>

</body>
</html>
